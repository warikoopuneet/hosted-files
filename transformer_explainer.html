<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Transformers Work</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg2:#0f1425;--bg3:#161d32;--bg4:#1c2440;
  --teal:#00c896;--teal-dim:rgba(0,200,150,0.1);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);
  --blue:#4d9eff;--blue-dim:rgba(77,158,255,0.1);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);
  --pink:#f472b6;--pink-dim:rgba(244,114,182,0.1);
  --red:#ff6b6b;--red-dim:rgba(255,107,107,0.1);
  --text:#dde3f0;--muted:#7a849e;--border:rgba(255,255,255,0.07);
  --mono:'IBM Plex Mono',monospace;--sans:'Sora',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}

.hdr{width:100%;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.hdr-left{display:flex;flex-direction:column;gap:2px}
.hdr-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:340px;justify-content:flex-end}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .3s;flex-shrink:0}
.dot.done{background:rgba(0,200,150,.35);border-color:var(--teal)}
.dot.active{background:var(--teal);box-shadow:0 0 10px var(--teal);transform:scale(1.4);border-color:var(--teal)}

.main{width:100%;max-width:860px;padding:32px 22px 0}
.s-label{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;opacity:0;animation:up .4s ease .05s forwards}
.s-title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:8px;opacity:0;animation:up .4s ease .1s forwards}
.s-sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:620px;margin-bottom:28px;opacity:0;animation:up .4s ease .15s forwards}

.viz{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 28px;margin-bottom:20px;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;opacity:0;animation:up .5s ease .2s forwards}
.viz-glow{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal) 40%,transparent);opacity:.35}

.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px;opacity:0;animation:up .4s ease .3s forwards}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.card.tl{border-left:2px solid var(--teal)}
.card.al{border-left:2px solid var(--amber)}
.card.bl{border-left:2px solid var(--blue)}
.card.pl{border-left:2px solid var(--purple)}
.card.rl{border-left:2px solid var(--red)}
.card-hd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:7px;font-family:var(--mono)}
.card p{font-size:13px;color:var(--muted);line-height:1.7}
.card p strong{color:var(--text);font-weight:600}
.card p em{color:var(--teal);font-style:normal;font-weight:500}

.nav{display:flex;justify-content:space-between;align-items:center;padding:0 0 36px;opacity:0;animation:up .4s ease .35s forwards}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:9px 20px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s}
.btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-nx{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700;padding:10px 28px}
.btn-nx:hover:not(:disabled){box-shadow:0 0 22px rgba(0,200,150,.4);background:#00e0aa}
.btn-nx:disabled{background:var(--bg3);color:var(--muted);border-color:var(--border);box-shadow:none}
.ct{font-family:var(--mono);font-size:11px;color:var(--muted)}

@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes gteal{0%,100%{box-shadow:0 0 6px rgba(0,200,150,.5)}50%{box-shadow:0 0 18px rgba(0,200,150,.9)}}
@keyframes gamber{0%,100%{box-shadow:0 0 6px rgba(245,166,35,.4)}50%{box-shadow:0 0 14px rgba(245,166,35,.8)}}
@keyframes drawL{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes sclIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.center{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.bdg{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 12px;border-radius:20px;border:1px solid;text-transform:uppercase}
.bdg.t{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.bdg.a{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.bdg.b{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.bdg.p{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.bdg.pk{border-color:var(--pink);color:var(--pink);background:var(--pink-dim)}
.tok{font-family:var(--mono);font-size:14px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);transition:all .3s}
.tok.ht{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.tok.ha{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.tok.hb{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.tok.hp{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.eq{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--bg3);padding:6px 16px;border-radius:6px;border:1px solid rgba(0,200,150,.18);display:inline-block}

.ltabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ltab{font-family:var(--mono);font-size:11px;padding:5px 16px;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;background:transparent}
.ltab.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.lvl-bar{height:3px;border-radius:2px;background:var(--bg3);margin-bottom:16px;overflow:hidden;width:100%;max-width:500px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">How Transformers Work</div>
    <div class="hdr-sub" id="sind">Beginner → Advanced · Step by step</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="transformer_deepdive.html" style="font-family:var(--mono);font-size:11px;padding:5px 14px;border-radius:6px;border:1px solid var(--amber);color:var(--amber);background:rgba(245,166,35,0.08);text-decoration:none;white-space:nowrap;transition:all .2s" onmouseover="this.style.background='rgba(245,166,35,0.18)'" onmouseout="this.style.background='rgba(245,166,35,0.08)'">Deep Dive →</a>
    <div class="dots" id="dots"></div>
  </div>
</div>

<div class="main">
  <div class="s-label" id="slabel"></div>
  <div class="s-title" id="stitle"></div>
  <div class="s-sub"   id="ssub"></div>
  <div class="viz"     id="viz"><div class="viz-glow"></div></div>
  <div class="cards"   id="cards"></div>
  <div class="nav">
    <button class="btn" id="bbk" onclick="prev()">← Back</button>
    <span class="ct" id="sct"></span>
    <button class="btn btn-nx" id="bnx" onclick="next()">Next →</button>
  </div>
</div>

<script>
const STAGES=[
{label:"Overview — The Big Picture",title:"What does a transformer actually do?",sub:"Let's start with the plain-English version before any math.",render:s0,
cards:[
{c:"tl",hd:"teal",head:"The one-line job",body:"A transformer reads some text and <strong>predicts the next word</strong>. That's the whole task. Do this billions of times during training and you get ChatGPT, Claude, or Gemini. They're all extremely good next-word predictors."},
{c:"al",hd:"amber",head:"Why it's revolutionary",body:"What makes transformers special is <strong>attention</strong> — the ability to look at every word in context at the same time. The word 'bank' in 'river bank' vs 'bank account' gets understood differently because of surrounding words."},
{c:"bl",hd:"blue",head:"What we'll trace",body:"We'll follow the sentence <em>'The cat sat'</em> through every step — from raw text all the way to the model predicting the next word. Click through each step at your own pace."}
]},

{label:"Step 1 — Tokenization",title:"Text gets chopped into tokens",sub:"The model can't read English directly. It first breaks text into small pieces called tokens.",render:s1,
cards:[
{c:"tl",hd:"teal",head:"What is a token?",body:"A token is usually a word or part of a word. 'cat' is one token. 'transformers' might split into two: <strong>'transform' + '##ers'</strong>. Spaces and punctuation are also tokens. GPT-4 uses roughly 100,000 unique token types."},
{c:"al",hd:"amber",head:"Why not use letters or full words?",body:"Letters = too many steps for a sentence. Full words = millions of unique items to track. Tokens are the <strong>Goldilocks middle ground</strong> — a manageable vocabulary, efficient sequences, and rare words just get split up."}
]},

{label:"Step 2 — Token IDs",title:"Each token becomes a number",sub:"The model only understands numbers. Every token gets a unique integer from a big lookup table.",render:s2,
cards:[
{c:"tl",hd:"teal",head:"The vocabulary dictionary",body:"Think of a giant dictionary: <strong>token string → integer</strong>. 'The' might be #1234, 'cat' might be #12312. After this step, the sentence becomes <strong>[1234, 12312, 7378]</strong>. Text is completely gone — only integers from here on."},
{c:"al",hd:"amber",head:"No meaning yet",body:"At this stage the model knows <em>nothing</em> about what these words mean. The number 1234 is no more meaningful than 1235. That changes in the next step."}
]},

{label:"Step 3 — Embeddings",title:"Numbers become rich meaning-vectors",sub:"Each integer is swapped for a list of ~512 floats that actually encode what the word means.",render:s3,
cards:[
{c:"tl",hd:"teal",head:"What's an embedding?",body:"Imagine a map where every word has coordinates. <strong>Similar words cluster together</strong>: 'cat', 'dog', 'kitten' sit near each other. 'Paris', 'London', 'Tokyo' form another cluster. An embedding is exactly this — just in 512 dimensions instead of 2."},
{c:"pl",hd:"purple",head:"They're learned, not hand-coded",body:"Nobody wrote these coordinates by hand. The model <strong>learned</strong> them by reading billions of sentences. Words that appear in similar contexts end up with similar vectors. This happens automatically."},
{c:"al",hd:"amber",head:"Famous example: king − man + woman ≈ queen",body:"The embedding vectors literally encode analogies. Subtract the 'man' direction, add the 'woman' direction, and you land near 'queen'. This <em>emerges on its own</em> from training — no one programmed it in."}
]},

{label:"Step 4 — Position",title:"Word order is injected with wave patterns",sub:"Transformers read all tokens at once in parallel — so we must explicitly tell them which word came first, second, third...",render:s4,
cards:[
{c:"tl",hd:"teal",head:"The problem: no built-in order",body:"'Dog bites man' and 'Man bites dog' have the same words but completely different meanings. Without position info, a transformer would treat them identically. We need to encode <strong>where each token sits</strong> in the sequence."},
{c:"al",hd:"amber",head:"The fix: add a unique wave pattern to each position",body:"A unique pattern of sine waves is <strong>added</strong> to each token's embedding. Position 0 gets one pattern, position 1 a slightly different one, and so on. Each position gets a fingerprint the model learns to read."},
{c:"bl",hd:"blue",head:"Why sine waves specifically?",body:"Sine waves at different frequencies let the model detect both <strong>absolute position</strong> (this is token 3) and <strong>relative position</strong> (A is 2 steps before B). They also generalize to sequences longer than anything seen during training."}
]},

{label:"Step 5 — Self-Attention",title:"Every word looks at every other word",sub:"This is the magic of transformers. Each token figures out which other tokens matter for its own meaning.",render:s5,
cards:[
{c:"tl",hd:"teal",head:"The human reading analogy",body:"Imagine reading: 'The <strong>bank</strong> by the river was steep.' When you hit 'bank', your brain immediately glances back at 'river' to understand which kind of bank. <strong>Attention does exactly this</strong> — each word scans the rest of the sentence for helpful context."},
{c:"al",hd:"amber",head:"Attention = relevance score",body:"For every pair of words, the model asks: <em>how relevant is word A for understanding word B?</em> High score = pay a lot of attention. Low score = mostly ignore. These scores then blend meaning from relevant words into each token."},
{c:"bl",hd:"blue",head:"'sat' learns it needs 'cat'",body:"In 'The cat sat', the word 'sat' (a verb needing a subject) pays high attention to 'cat' (the subject). It pays low attention to 'The'. After attention, 'sat' now <em>knows</em> a cat is doing the sitting."}
]},

{label:"Step 6 — Query, Key, Value (QKV)",title:"The library card catalog analogy",sub:"Here's exactly how attention scores are calculated — using three simple roles every token plays.",render:s6,
cards:[
{c:"tl",hd:"teal",head:"The library analogy (beginner)",body:"You walk into a library with a <strong>Query</strong>: 'books about space travel'. Every book has a <strong>Key</strong> on its spine — a short description of what it's about. The librarian scores how well your query matches each key. You then get the matching books' <strong>Values</strong> (actual content)."},
{c:"al",hd:"amber",head:"In a transformer",body:"Each token creates 3 vectors. <strong>Query (Q)</strong> = what context am I looking for? <strong>Key (K)</strong> = what context do I offer? <strong>Value (V)</strong> = what meaning do I contribute? The token 'sat' sends a Query, each other word responds with a Key, and high matches pull in that word's Value."},
{c:"pl",hd:"purple",head:"Semantic meaning of QKV for 'sat'",body:"'sat' is a verb that needs a subject. Its Q asks: 'who is doing this?'. 'cat' replies with a K that says: 'I'm a subject-noun'. High match → 'sat' absorbs 'cat's V (feline concepts, subject role). After this, 'sat' contains a blend of its own meaning <em>plus context from 'cat'</em>."},
{c:"bl",hd:"blue",head:"Google Search is basically this",body:"Your search query = <strong>Q</strong>. Each webpage's title/description = <strong>K</strong>. The actual page content = <strong>V</strong>. Search ranks pages by Q·K similarity, then returns their V. Transformers do this for every word, against every other word, all at once."}
]},

{label:"Step 7 — Attention Matrix",title:"The attention matrix, from simple to advanced",sub:"Let's see what the QKV scores actually look like — with three levels of explanation.",render:s7,
cards:[
{c:"tl",hd:"teal",head:"Level 1: What you're looking at",body:"The matrix is a grid. Each row is a word <em>asking</em> and each column is a word <em>being asked</em>. A bright cell means 'this word paid a lot of attention to that word.' <strong>Bright = high influence. Dark = ignored.</strong>"},
{c:"al",hd:"amber",head:"Level 2: How the scores are computed",body:"score(i→j) = dot product of token i's <strong>Q</strong> with token j's <strong>K</strong>, divided by √dimension. Division prevents numbers getting too large. Then softmax turns each row into percentages that sum to 1. <strong>0.72 means 72% of attention budget goes to that word.</strong>"},
{c:"pl",hd:"purple",head:"Level 3: Multi-head attention",body:"One attention head might track subject-verb pairs. Another might track pronoun references. Another might track adjective-noun links. <strong>Multi-head attention</strong> runs 8–16 of these in parallel with different learned weights, each discovering different linguistic relationships, then concatenates everything."}
]},

{label:"Step 8 — The KV Cache",title:"Why Key and Value get cached for speed",sub:"This is the engineering trick that makes ChatGPT fast when generating long responses.",render:s8,
cards:[
{c:"rl",hd:"red",head:"The slow way (no cache)",body:"The model generates one token at a time. Without a cache, each new token would require re-computing <strong>K and V vectors for every previous token</strong> from scratch. For a 1000-token response: 1000 × 1000 = 1 million redundant computations."},
{c:"tl",hd:"teal",head:"The key insight",body:"Once a token is generated, its K and V vectors <strong>never change</strong>. 'The' will always produce the same K and V regardless of what comes after. Only the <strong>Query is new</strong> each step — it's asking 'given everything before me, what's relevant?'"},
{c:"bl",hd:"blue",head:"The KV Cache solution",body:"Store all past K and V vectors in memory. Each new token only needs to: <strong>1)</strong> compute its own Q, K, V, <strong>2)</strong> retrieve all cached K, V, <strong>3)</strong> compute attention. This turns O(n²) recomputation into O(n) — dramatically faster for long texts."},
{c:"pl",hd:"purple",head:"The real-world tradeoff",body:"The KV cache eats a lot of <strong>GPU memory</strong>. A model with a 128k-token context window needs gigabytes just for the cache. This is a primary reason why long-context models are expensive to run — you're paying for all that stored K and V memory."}
]},

{label:"Step 9 — Feed-Forward Network",title:"Each token thinks independently",sub:"After attention mixes context across tokens, each token gets processed by its own small neural network.",render:s9,
cards:[
{c:"tl",hd:"teal",head:"What it does",body:"The feed-forward network (FFN) is applied to <strong>each token independently</strong> — the same mini neural net runs in parallel on all tokens. It adds non-linearity, the ability to express complex patterns beyond simple combinations."},
{c:"al",hd:"amber",head:"Where 'knowledge' is stored",body:"Researchers believe FFN layers store <strong>factual knowledge</strong> — things like 'Paris is the capital of France'. Attention = cross-word reasoning. FFN = per-token memory. Attention figures out relationships; FFN looks up stored facts."},
{c:"bl",hd:"blue",head:"The structure",body:"Two linear layers with ReLU between them: <strong>Linear(512 → 2048) → ReLU → Linear(2048 → 512)</strong>. The hidden layer is 4× wider, giving the model more processing capacity. This expand-then-contract pattern appears throughout modern architectures."}
]},

{label:"Step 10 — Output",title:"Predicting the next token",sub:"After passing through N transformer layers, the final vector becomes probabilities over the entire vocabulary.",render:s10,
cards:[
{c:"tl",hd:"teal",head:"Logits → probabilities",body:"The final embedding is multiplied by the unembedding matrix to produce one score (called a <strong>logit</strong>) per vocabulary token. Softmax converts these scores into probabilities that sum to 1. The highest probability token is typically selected."},
{c:"al",hd:"amber",head:"Temperature controls creativity",body:"<strong>Temperature</strong> scales the logits before softmax. Low temp (0.1) = always pick the top word — precise but repetitive. High temp (1.5) = more randomness, more creative but can be nonsensical. Most chatbots use 0.7–1.0."},
{c:"bl",hd:"blue",head:"The generation loop",body:"The predicted token is appended to the input, and the <em>entire pipeline runs again</em> — token by token — until the model emits an end-of-sequence token or hits a length limit. A 200-word response runs this full pipeline roughly 270 times."}
]}
];

let cur=0;

function buildDots(){
  const c=document.getElementById('dots');c.innerHTML='';
  STAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i<cur?' done':'')+(i===cur?' active':'');
    d.title=STAGES[i].label;d.onclick=()=>go(i);c.appendChild(d);
  });
}
function go(i){cur=i;render()}
function next(){if(cur<STAGES.length-1){cur++;render()}}
function prev(){if(cur>0){cur--;render()}}

function fi(d){return`style="opacity:0;animation:up .4s ease ${d}s forwards"`}

function render(){
  const s=STAGES[cur];
  document.getElementById('sind').textContent=`Step ${cur+1} of ${STAGES.length}`;
  document.getElementById('sct').textContent=`${cur+1} / ${STAGES.length}`;
  function sw(id,tag,cls){const o=document.getElementById(id);const n=document.createElement(tag);n.id=id;if(cls)n.className=cls;o.replaceWith(n);return n}
  sw('slabel','div','s-label').textContent=s.label;
  sw('stitle','div','s-title').textContent=s.title;
  sw('ssub','div','s-sub').textContent=s.sub;
  const v=sw('viz','div','viz');v.innerHTML='<div class="viz-glow"></div>';
  sw('cards','div','cards');
  document.querySelector('.nav').outerHTML=`<div class="nav" ${fi(.35)}>
    <button class="btn" onclick="prev()" ${cur===0?'disabled':''}>← Back</button>
    <span class="ct" id="sct">${cur+1} / ${STAGES.length}</span>
    <button class="btn btn-nx" onclick="next()" ${cur===STAGES.length-1?'disabled':''}>Next →</button>
  </div>`;
  buildDots();s.render();
  const cc=document.getElementById('cards');
  s.cards.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className=`card ${c.c}`;div.style=`opacity:0;animation:up .4s ease ${.3+i*.1}s forwards`;
    const colors={teal:'var(--teal)',amber:'var(--amber)',blue:'var(--blue)',purple:'var(--purple)',red:'var(--red)'};
    div.innerHTML=`<div class="card-hd" style="color:${colors[c.hd]}"><div style="width:7px;height:7px;border-radius:50%;background:${colors[c.hd]};flex-shrink:0"></div>${c.head}</div><p>${c.body}</p>`;
    cc.appendChild(div);
  });
}

/* ── STAGE RENDERS ─────────────────────────────────── */

function s0(){
  document.getElementById('viz').innerHTML+=`<div class="center">
    <div ${fi(.05)}><div class="bdg t">the one-line summary</div></div>
    <div ${fi(.12)} style="text-align:center">
      <div style="font-size:34px;font-weight:700;color:var(--text);line-height:1.2">"What word<br>comes next?"</div>
      <div style="font-size:14px;color:var(--muted);margin-top:8px">Asked billions of times during training → learns language</div>
    </div>
    <div ${fi(.3)} style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      ${['Raw text','Tokenize','Embed','+ Position','✦ Attention × N','FFN × N','Predict'].map((label,i,a)=>`
      <div style="display:flex;align-items:center;gap:6px">
        <div style="padding:7px 14px;border-radius:7px;border:1px solid ${i===4?'var(--amber)':i===6?'var(--teal)':'var(--border)'};background:${i===4?'var(--amber-dim)':i===6?'var(--teal-dim)':'var(--bg3)'};font-family:var(--mono);font-size:11px;color:${i===4?'var(--amber)':i===6?'var(--teal)':'var(--muted)'}">${label}</div>
        ${i<a.length-1?'<div style="color:var(--muted);font-size:11px">→</div>':''}
      </div>`).join('')}
    </div>
  </div>`;
}

function s1(){
  document.getElementById('viz').innerHTML+=`<div class="center">
    <div ${fi(.05)}><div class="bdg t">tokenization</div></div>
    <div ${fi(.1)} style="font-family:var(--mono);font-size:18px;color:var(--muted);padding:12px 24px;border-radius:10px;border:1px solid var(--border);background:var(--bg3)">"The cat sat"</div>
    <div ${fi(.2)} style="font-size:20px;color:var(--muted);animation:pulse 2s infinite">↓</div>
    <div class="row" style="margin-top:4px">
