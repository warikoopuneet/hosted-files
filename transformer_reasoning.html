<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasoning vs Normal Generation — Visual Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08111f;--bg2:#0c1728;--bg3:#111f33;--bg4:#172640;
  --teal:#00d4a8;--teal-dim:rgba(0,212,168,0.09);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.09);
  --blue:#4da6ff;--blue-dim:rgba(77,166,255,0.09);
  --purple:#b09eff;--purple-dim:rgba(176,158,255,0.09);
  --pink:#ff7eb3;--pink-dim:rgba(255,126,179,0.09);
  --red:#ff6b6b;--red-dim:rgba(255,107,107,0.09);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.09);
  --text:#dde3f0;--muted:#6e7d96;--border:rgba(255,255,255,0.06);
  --mono:'IBM Plex Mono',monospace;--sans:'Sora',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}

/* Header */
.hdr{width:100%;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;gap:12px}
.hdr-brand{display:flex;flex-direction:column;gap:1px}
.hdr-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.hdr-sub{font-family:var(--mono);font-size:10px;color:var(--muted)}
.hdr-links{display:flex;gap:8px;align-items:center}
.hdr-link{font-family:var(--mono);font-size:10px;padding:4px 12px;border-radius:5px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .2s;white-space:nowrap}
.hdr-link:hover{border-color:var(--purple);color:var(--purple)}

/* Mode tabs */
.mode-tabs{display:flex;width:100%;max-width:860px;margin-top:0;border-bottom:1px solid var(--border)}
.mode-tab{flex:1;padding:16px 12px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .25s;display:flex;flex-direction:column;gap:4px;align-items:center}
.mode-tab .tab-icon{font-size:18px}
.mode-tab .tab-name{font-size:13px;font-weight:600;color:var(--muted);transition:color .25s}
.mode-tab .tab-sub{font-size:11px;color:var(--muted);transition:color .25s}
.mode-tab.active{border-bottom-color:var(--purple)}
.mode-tab.active .tab-name,.mode-tab.active .tab-sub{color:var(--text)}
.mode-tab:hover .tab-name{color:var(--text)}

/* Main */
.main{width:100%;max-width:860px;padding:28px 22px 0}

/* Stage navigation */
.stage-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.snav-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:all .3s}
.snav-dot.done{background:rgba(176,158,255,.35);border-color:var(--purple)}
.snav-dot.active{background:var(--purple);box-shadow:0 0 8px var(--purple);transform:scale(1.4)}

/* Content */
.stage-wrap{display:none}.stage-wrap.visible{display:block}
.s-tag{font-family:var(--mono);font-size:10px;color:var(--purple);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;opacity:0;animation:up .4s ease .05s forwards}
.s-title{font-size:24px;font-weight:700;line-height:1.25;margin-bottom:8px;opacity:0;animation:up .4s ease .1s forwards}
.s-sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:640px;margin-bottom:22px;opacity:0;animation:up .4s ease .15s forwards}

/* Viz */
.viz{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;margin-bottom:16px;min-height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.viz::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--purple) 40%,transparent);opacity:.3}

/* Insight cards */
.insights{display:grid;gap:10px;margin-bottom:20px}
.ins{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:14px 18px}
.ins.tl{border-left:2px solid var(--teal)}.ins.al{border-left:2px solid var(--amber)}.ins.bl{border-left:2px solid var(--blue)}.ins.pl{border-left:2px solid var(--purple)}.ins.gl{border-left:2px solid var(--green)}.ins.rl{border-left:2px solid var(--red)}
.ins-hd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.ins p{font-size:13px;color:var(--muted);line-height:1.7}
.ins p strong{color:var(--text);font-weight:600}
.ins p em{color:var(--teal);font-style:normal;font-weight:500}
.ins p code{font-family:var(--mono);font-size:11px;color:var(--amber);background:var(--bg3);padding:1px 6px;border-radius:4px}

/* Nav */
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:0 0 32px;opacity:0;animation:up .4s ease .3s forwards}
.nbtn{font-family:var(--sans);font-size:13px;font-weight:500;padding:9px 20px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s}
.nbtn:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
.nbtn-nx{background:var(--purple);color:#000;border-color:var(--purple);font-weight:700;padding:10px 28px}
.nbtn-nx:hover:not(:disabled){box-shadow:0 0 22px rgba(176,158,255,.4);background:#c4b5ff}
.nbtn-nx:disabled{background:var(--bg3);color:var(--muted);border-color:var(--border);box-shadow:none}
.nct{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Animations */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes drawL{from{stroke-dashoffset:800}to{stroke-dashoffset:0}}
@keyframes popIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideR{from{transform:translateX(-16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideU{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes gpurple{0%,100%{box-shadow:0 0 5px rgba(176,158,255,.5)}50%{box-shadow:0 0 16px rgba(176,158,255,.9)}}
@keyframes gteal{0%,100%{box-shadow:0 0 5px rgba(0,212,168,.5)}50%{box-shadow:0 0 16px rgba(0,212,168,.9)}}
@keyframes gamber{0%,100%{box-shadow:0 0 5px rgba(245,166,35,.5)}50%{box-shadow:0 0 16px rgba(245,166,35,.9)}}
@keyframes ggreen{0%,100%{box-shadow:0 0 5px rgba(74,222,128,.5)}50%{box-shadow:0 0 16px rgba(74,222,128,.9)}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes grow{from{width:0}to{}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Shared */
.center{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.bdg{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 12px;border-radius:20px;border:1px solid;text-transform:uppercase}
.bdg.p{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.bdg.t{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.bdg.a{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.bdg.g{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.eq{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--bg3);padding:6px 16px;border-radius:6px;border:1px solid rgba(0,212,168,.15);display:inline-block}

/* Token chip */
.chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:7px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.thinking{border-color:var(--purple);color:var(--purple);background:var(--purple-dim)}
.chip.output{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.chip.input{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.chip.backtrack{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.chip.verify{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* Forward pass box */
.fpass{border:1px solid var(--border);border-radius:10px;background:var(--bg3);padding:10px 16px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px}
.fpass-label{color:var(--muted)}
.fpass-layers{display:flex;gap:3px;align-items:center}
.fpass-layer{width:18px;height:18px;border-radius:3px;background:var(--purple-dim);border:1px solid rgba(176,158,255,.3);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--purple)}

/* Context window bar */
.ctx-bar{width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;height:28px;background:var(--bg3);position:relative}
.ctx-segment{height:100%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;transition:width .5s ease}

/* fi helper inline */
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-title">Reasoning Visualized</div>
    <div class="hdr-sub">Normal · Chain-of-Thought · Extended Thinking</div>
  </div>
  <div class="hdr-links">
    <a href="transformer_explainer.html" class="hdr-link">← Main Guide</a>
    <a href="transformer_deepdive.html" class="hdr-link">Deep Dive</a>
  </div>
</div>

<!-- MODE TABS -->
<div class="mode-tabs" id="mode-tabs">
  <div class="mode-tab active" onclick="setMode(0)">
    <div class="tab-icon">⚡</div>
    <div class="tab-name">Normal Generation</div>
    <div class="tab-sub">One pass → answer</div>
  </div>
  <div class="mode-tab" onclick="setMode(1)">
    <div class="tab-icon">🔗</div>
    <div class="tab-name">Chain of Thought</div>
    <div class="tab-sub">Think before answering</div>
  </div>
  <div class="mode-tab" onclick="setMode(2)">
    <div class="tab-icon">🧠</div>
    <div class="tab-name">Extended Thinking</div>
    <div class="tab-sub">RL-trained reasoning</div>
  </div>
</div>

<div class="main" id="main-area"></div>

<script>
/* ════════════════════════════════════════════
   DATA
════════════════════════════════════════════ */
const MODES = [

/* ── MODE 0: NORMAL GENERATION ────────────────────── */
{
  stages: [
    {
      tag:"Normal — Step 1", title:"The prompt enters the context window",
      sub:"Everything the model knows about your request is contained in the input tokens. This is the only input it has.",
      render: n0, 
      insights:[
        {c:"al",hd:"amber",head:"The context window is working memory",body:"Think of the context window as a whiteboard. <strong>Everything the model can see at once</strong> is on that whiteboard — your prompt, any history, any documents. Nothing outside it exists to the model."},
        {c:"tl",hd:"teal",head:"Tokens are the unit of thought",body:"The prompt is split into tokens. Each token gets an embedding, positional encoding, and passes through all attention layers. By the end, the model has a <strong>rich contextual representation</strong> of every token in the prompt."}
      ]
    },
    {
      tag:"Normal — Step 2", title:"One forward pass through all N layers",
      sub:"The model processes your entire prompt in one parallel sweep through all transformer layers. This is called the prefill.",
      render: n1,
      insights:[
        {c:"pl",hd:"purple",head:"All layers fire in sequence, tokens in parallel",body:"Layer 1's attention runs on all tokens simultaneously. Then layer 2, then layer 3... up to layer N (32–96 layers in large models). The output of each layer feeds the next. <strong>Depth = how many times the model 'thinks' about the input.</strong>"},
        {c:"al",hd:"amber",head:"Fixed compute regardless of question difficulty",body:"Whether you ask '2+2' or 'explain quantum mechanics', the same N layers run. The model has a <strong>fixed compute budget per token</strong>. This is the fundamental limitation that CoT and reasoning are designed to solve."}
      ]
    },
    {
      tag:"Normal — Step 3", title:"The model predicts and emits the next token",
      sub:"After the final layer, a probability distribution over the vocabulary is produced. One token is sampled. Then the loop repeats.",
      render: n2,
      insights:[
        {c:"tl",hd:"teal",head:"One token at a time, always",body:"Even in normal mode the model generates token by token — not word by word, not sentence by sentence. <strong>Each token is one full forward pass</strong> over the growing context. The difference from CoT is what those tokens *are*."},
        {c:"bl",hd:"blue",head:"The answer must be compressed into the first token",body:"In normal generation, the model goes straight to answer tokens. For a simple question this is fine. For a hard math problem, the model must somehow arrive at the correct answer <strong>without any working-out space</strong>. That's the bottleneck."}
      ]
    }
  ]
},

/* ── MODE 1: CHAIN OF THOUGHT ─────────────────────── */
{
  stages: [
    {
      tag:"CoT — Step 1", title:"The prompt asks the model to think first",
      sub:"A simple instruction changes everything: 'think step by step'. The model now generates reasoning tokens before answer tokens.",
      render: c0,
      insights:[
        {c:"pl",hd:"purple",head:"Nothing changes inside the model",body:"The weights are identical to normal generation. The architecture is identical. The only change is <strong>what tokens the model is expected to generate first</strong>. CoT is a prompting strategy, not a model capability."},
        {c:"al",hd:"amber",head:"Why does it work then?",body:"Because the model was trained on human text — and humans who write things out step-by-step arrive at correct answers more often. The model has <strong>learned that reasoning-shaped text precedes correct answers</strong>. Prompting 'think step by step' activates that learned pattern."}
      ]
    },
    {
      tag:"CoT — Step 2", title:"Each reasoning token is a full forward pass",
      sub:"Watch how the context window grows. Each new thinking token conditions the next forward pass — giving the model more 'time' to work on the problem.",
      render: c1,
      insights:[
        {c:"tl",hd:"teal",head:"Context window as scratch paper",body:"The generated reasoning tokens live in the context window. When generating the next token, the model <strong>sees all previous reasoning tokens as input</strong>. It's literally reading its own working-out and building on it."},
        {c:"pl",hd:"purple",head:"More tokens = more effective depth",body:"A model with 32 layers generating 50 reasoning tokens effectively applies 32×50 = 1,600 'layer-equivalents' of computation to the problem. Normal generation on the same prompt: just 32 layers. <strong>This is why CoT improves hard reasoning dramatically.</strong>"},
        {c:"al",hd:"amber",head:"The quality of reasoning tokens matters",body:"If early reasoning tokens are wrong, later tokens build on wrong premises. The model can get confidently stuck in a bad direction. This is CoT's weakness — <strong>it can't backtrack</strong>. Once a wrong reasoning step is emitted, it becomes part of the context."}
      ]
    },
    {
      tag:"CoT — Step 3", title:"The answer token — now fully informed",
      sub:"After N reasoning tokens, the model finally generates the answer. The answer token sees all the working-out as context.",
      render: c2,
      insights:[
        {c:"gl",hd:"green",head:"The answer token has a huge advantage",body:"When generating the final answer in CoT, the model's context contains all its working steps. The final forward pass sees a <strong>fully reasoned context</strong> and just needs to emit the conclusion — much easier than arriving at an answer cold."},
        {c:"bl",hd:"blue",head:"CoT vs no CoT on hard problems",body:"GSM8K math benchmark: GPT-4 without CoT ~57% accuracy. GPT-4 with CoT ~92%. Same model, same weights. The <strong>extra compute from reasoning tokens</strong> — not any model change — drives the improvement."},
        {c:"al",hd:"amber",head:"Limitation: reasoning is visible and linear",body:"CoT reasoning is just output tokens — the model generates them sequentially and can't revise them. It reasons like someone writing an essay: <em>forward only</em>. Extended thinking (next tab) solves this."}
      ]
    }
  ]
},

/* ── MODE 2: EXTENDED THINKING ─────────────────────── */
{
  stages: [
    {
      tag:"Extended Thinking — Step 1", title:"The model has a private scratchpad",
      sub:"Unlike CoT where all reasoning is output tokens, extended thinking happens in a hidden 'thinking' space — trained by RL to be genuinely useful.",
      render: e0,
      insights:[
        {c:"pl",hd:"purple",head:"Two different token streams",body:"Extended thinking models produce two streams: <strong>thinking tokens</strong> (the scratchpad — sometimes hidden from you) and <strong>answer tokens</strong> (what you see). The thinking stream is where real exploration happens."},
        {c:"al",hd:"amber",head:"Trained by reinforcement learning, not imitation",body:"Normal models and CoT models learn by imitating human text. Extended thinking models are trained by <strong>trying many reasoning paths and reinforcing the ones that led to correct answers</strong>. The model learns what reasoning strategies actually work — not just what reasoning looks like."}
      ]
    },
    {
      tag:"Extended Thinking — Step 2", title:"The model can backtrack, verify, and restart",
      sub:"This is the key difference. RL training rewards correct final answers, so the model learned that sometimes you need to abandon a bad path and try again.",
      render: e1,
      insights:[
        {c:"tl",hd:"teal",head:"Backtracking is a trained skill",body:"During RL training, paths that included <em>'wait, that's wrong, let me try again'</em> sometimes led to correct answers. Paths without self-correction often didn't. So the model learned to <strong>actively check its own work and revise</strong>. This isn't programmed — it emerged from the reward signal."},
        {c:"pl",hd:"purple",head:"Verification loops",body:"The model might solve a sub-problem, then ask itself 'does this answer satisfy the original constraints?', then discover it doesn't, then retry. These <strong>multi-step verification loops</strong> are learned behaviors — not explicitly coded — because they improve the final answer rate during training."},
        {c:"gl",hd:"green",head:"More thinking budget = better answers",body:"You can often set a 'thinking budget' — how many tokens the model can use for its scratchpad. More budget → more exploration → higher accuracy on hard problems. There's a <strong>direct tradeoff between thinking tokens spent and answer quality.</strong>"}
      ]
    },
    {
      tag:"Extended Thinking — Step 3", title:"The final answer emerges from the best reasoning path",
      sub:"After exploring, backtracking, and verifying, the model produces its answer — informed by a much richer internal process than linear CoT.",
      render: e2,
      insights:[
        {c:"gl",hd:"green",head:"Accuracy jumps on hard problems",body:"On competition math (AIME): standard GPT-4 ~3–8%. GPT-4 with CoT ~15–20%. o1/o3 with extended thinking <strong>~70–90%</strong>. Same underlying architecture. The reasoning training is doing almost all the work."},
        {c:"tl",hd:"teal",head:"The thinking is genuinely different",body:"CoT reasoning looks like a human writing an essay — linear, no revision. Extended thinking looks more like a human with a whiteboard — <em>trying something, erasing, trying again, checking against constraints</em>. The RL training shaped the model to actually explore solution space."},
        {c:"al",hd:"amber",head:"Still next-token prediction under the hood",body:"None of this changes the fundamental architecture. Every thinking token and answer token is still generated by the same next-token prediction mechanism. What changed is <strong>which reasoning patterns the model learned to generate</strong> — shaped by what actually works on hard problems."}
      ]
    }
  ]
}
];

let mode = 0;
let stages = [0, 0, 0]; // current stage per mode

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',i===m));
  renderStage();
}

function fi(d){return `style="opacity:0;animation:up .4s ease ${d}s forwards"`}

function renderStage(){
  const s = MODES[mode].stages[stages[mode]];
  const total = MODES[mode].stages.length;
  const cur = stages[mode];
  const area = document.getElementById('main-area');

  area.innerHTML = `
    <div class="stage-nav" id="snav"></div>
    <div class="s-tag">${s.tag}</div>
    <div class="s-title">${s.title}</div>
    <div class="s-sub">${s.sub}</div>
    <div class="viz" id="viz"></div>
    <div class="insights" id="insights"></div>
    <div class="nav-bar">
      <button class="nbtn" onclick="goStage(-1)" ${cur===0?'disabled':''}>← Back</button>
      <span class="nct">${cur+1} / ${total}</span>
      <button class="nbtn nbtn-nx" onclick="goStage(1)" ${cur===total-1?'disabled':''}>Next →</button>
    </div>
  `;

  // dots
  const snav = document.getElementById('snav');
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='snav-dot'+(i<cur?' done':'')+(i===cur?' active':'');
    d.onclick=()=>{stages[mode]=i;renderStage()};
    snav.appendChild(d);
  }

  // render viz
  s.render();

  // render insight cards
  const ins = document.getElementById('insights');
  const cmap={teal:'var(--teal)',amber:'var(--amber)',blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)',red:'var(--red)'};
  s.insights.forEach((card,i)=>{
    const div=document.createElement('div');
    div.className=`ins ${card.c}`;
    div.style=`opacity:0;animation:up .4s ease ${.28+i*.1}s forwards`;
    div.innerHTML=`<div class="ins-hd" style="color:${cmap[card.hd]}"><div style="width:7px;height:7px;border-radius:50%;background:${cmap[card.hd]};flex-shrink:0"></div>${card.head}</div><p>${card.body}</p>`;
    ins.appendChild(div);
  });
}

function goStage(dir){
  const total=MODES[mode].stages.length;
  stages[mode]=Math.max(0,Math.min(total-1,stages[mode]+dir));
  renderStage();
}

/* ════════════════════════════════════════════
   VIZ RENDER FUNCTIONS
════════════════════════════════════════════ */

/* ── NORMAL ──────────────────────────────── */
function n0(){
  const v=document.getElementById('viz');
  v.innerHTML=`<div class="center">
    <div ${fi(.05)}><div class="bdg a">context window — the model's entire world</div></div>
    <div style="width:100%;max-width:580px" ${fi(.12)}>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:6px">CONTEXT WINDOW (e.g. 128,000 tokens max)</div>
      <div style="border:1px solid var(--amber);border-radius:10px;background:var(--amber-dim);padding:16px;position:relative;overflow:hidden">
        <div style="position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(245,166,35,.1),transparent);animation:shimmer 2.5s .5s infinite;background-size:200% 100%"></div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--amber);margin-bottom:10px">YOUR PROMPT</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${["What","is","the","capital","of","France","?"].map((t,i)=>`<div class="chip input" ${fi(.2+i*.06)}>${t}</div>`).join('')}

function c1(){
  const v=document.getElementById('viz');

  const steps=[

    {tokens:["=","150","miles"], type:'thinking', label:'Reasoning token 18–20', ctx:22, desc:'Working out the multiplication in tokens'},
  ];
  let step=0;

  function drawStep(){
    const s=steps[step];
    document.getElementById('cot-tokens').innerHTML=steps.slice(0,step+1).map((st,si)=>`
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">

      <div style="font-family:var(--mono);font-size:9px;color:var(--purple)">${st.label}</div>
    </div>`).join('');

    // context bar
    const pct=Math.round((7+step*3.2)/128000*100*40);
    document.getElementById('ctx-fill').style.width=Math.max(1,pct)+'%';
    document.getElementById('ctx-used').textContent=7+step*3;

    document.getElementById('cprev').disabled=step===0;

        <span style="color:var(--purple)">Each reasoning token = 1 forward pass</span>
      </div>

        <div id="ctx-fill" style="height:100%;border-radius:8px;background:var(--purple);transition:width .5s ease;width:0.3%;min-width:4px"></div>

    <div style="display:flex;gap:10px" ${fi(.3)}>
      <button id="cprev" onclick="cotStep(-1)" style="font-family:var(--mono);font-size:11px;padding:5px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer" disabled>← prev</button>

}

        <div style="display:flex;justify-content:space-between;margin-bottom:5px">

          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${col}">${pct}%</div>
        </div>
        <div style="height:26px;border-radius:6px;background:var(--bg3);overflow:hidden">
          <div style="height:100%;border-radius:6px;background:${col};width:0;animation:grow .9s ease ${.4+i*.18}s forwards;display:flex;align-items:center;padding-left:10px">
            <span style="font-family:var(--mono);font-size:10px;color:#000;font-weight:700;white-space:nowrap;opacity:${pct>12?1:0}">${pct}%</span>
          </div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${note}</div>
      </div>`).join('')}
    </div>
    <!-- The key point -->
    <div style="width:100%;max-width:560px;border:1px solid var(--purple);border-radius:12px;padding:16px;background:var(--purple-dim)" ${fi(.75)}>
      <div style="font-family:var(--mono);font-size:10px;color:var(--purple);letter-spacing:.1em;margin-bottom:8px">THE FUNDAMENTAL INSIGHT</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">
        All three use the <strong style="color:var(--text)">same transformer architecture</strong>. Tokens are still just next-token prediction. The difference is entirely in <strong style="color:var(--text)">what the model learned to generate</strong>:
        <br><br>
        Normal: learned to generate answers directly.<br>
        CoT: prompted to generate reasoning first.<br>
        Extended thinking: <strong style="color:var(--purple)">learned via RL that generating specific reasoning patterns — including backtracking and verification — leads to correct answers.</strong>
      </div>
    </div>
  </div>`;
}

/* ── BOOT ──────────────────────────── */
renderStage();
</script>
</body>
</html>
